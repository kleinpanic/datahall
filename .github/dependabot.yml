version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # pnpm lockfile updater regularly fails on `increase` when grouped updates
    # touch transitive deps (e.g. @vitest/mocker). `increase-if-necessary` keeps
    # manifests minimally bumped; the explicit ignore suppresses the known noisy
    # transitive so weekly runs stay green.
    versioning-strategy: increase-if-necessary
    ignore:
      - dependency-name: '@vitest/mocker'
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
